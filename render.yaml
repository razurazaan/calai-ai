# Render blueprint: deploys the API (and the web client it serves) as one free web service.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: calsnap-api
    runtime: node
    plan: free
    # No rootDir: the build needs both server/ and client/, and Render hides files outside rootDir.
    # --include=dev: NODE_ENV=production would otherwise skip Vite, which the client build needs.
    # The server's postinstall builds the client on Render (server/scripts/build-client.js)
    buildCommand: npm install --prefix server --omit=optional
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.6-flash
      - key: AI_FREE_DAILY_SCAN_LIMIT
        value: "3"
      - key: AI_PRO_DAILY_SCAN_LIMIT
        value: "20"
      - key: AI_SCANS_PER_MINUTE
        value: "5"
      - key: AI_MAX_IMAGE_MB
        value: "4"
      # Admins are made with `node scripts/make-admin.js you@example.com` (see README), not by email setting

  # Admin website: a separate static site that reads the API above.
  # After the first deploy, set VITE_API_URL to the API's address (e.g. https://calsnap-api.onrender.com)
  # in this service's Environment tab and redeploy. Only accounts with the admin role can log in.
  - type: web
    name: calsnap-admin
    runtime: static
    buildCommand: npm install --prefix admin && npm run build --prefix admin
    staticPublishPath: admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
