# Keeps the free Render service awake: it sleeps after 15 min without traffic.
# Scheduled workflows only run on the default branch, and GitHub pauses them after
# 60 days with no commits (re-enable from the Actions tab if that happens).
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://calai-ai.onrender.com/api/health
